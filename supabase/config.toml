project_id = "octop-web"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Catches outbound mail locally so sign-up confirmations can be inspected
# without sending anything to a real address.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development only. In the hosted project decide this in the dashboard.
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[functions.chat]
# Gateway-level JWT verification on top of the checks the function performs
# itself. The function still calls auth.getUser() and runs every query through
# a user-scoped client, so RLS remains the real boundary.
verify_jwt = true

[analytics]
enabled = false
